services:
  # 1. Node.js Backend API
  - type: web
    name: zalando-pro-api
    env: node
    buildCommand: npm install
    startCommand: npm run server
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: ADMIN_SECRET
        generateValue: true

  # 2. React Frontend Static Site
  - type: web
    name: zalando-pro-web
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: zalando-pro-api
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      # SPA Routing Fallback
      - type: rewrite
        source: /*
        destination: /index.html
